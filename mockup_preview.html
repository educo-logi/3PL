<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Page Design Mockup</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons (handled via script or SVG) -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
        }
    </style>
</head>

<body class="bg-gray-50 p-10">

    <div class="max-w-5xl mx-auto space-y-10">

        <!-- Header -->
        <div class="flex items-center justify-between">
            <div>
                <h1 class="text-3xl font-bold text-gray-900">마이페이지</h1>
                <p class="text-gray-500 mt-1">기업 정보를 한눈에 확인하세요</p>
            </div>
            <button class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition">
                정보 수정
            </button>
        </div>

        <!-- Section 1: Basic Info Cards -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">

            <!-- Card 1: Representative -->
            <div
                class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex items-center space-x-4 hover:shadow-md transition">
                <div
                    class="w-14 h-14 bg-indigo-500 rounded-xl flex items-center justify-center text-white shadow-indigo-200 shadow-lg">
                    <i data-lucide="user" class="w-7 h-7"></i>
                </div>
                <div>
                    <p class="text-sm text-gray-500 font-medium">대표자명</p>
                    <p class="text-xl font-bold text-gray-800">홍길동</p>
                </div>
            </div>

            <!-- Card 2: Phone -->
            <div
                class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex items-center space-x-4 hover:shadow-md transition">
                <div
                    class="w-14 h-14 bg-emerald-500 rounded-xl flex items-center justify-center text-white shadow-emerald-200 shadow-lg">
                    <i data-lucide="phone" class="w-7 h-7"></i>
                </div>
                <div>
                    <p class="text-sm text-gray-500 font-medium">대표 전화</p>
                    <p class="text-xl font-bold text-gray-800">010-1234-5678</p>
                </div>
            </div>

            <!-- Card 3: Email -->
            <div
                class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex items-center space-x-4 hover:shadow-md transition">
                <div
                    class="w-14 h-14 bg-blue-500 rounded-xl flex items-center justify-center text-white shadow-blue-200 shadow-lg">
                    <i data-lucide="mail" class="w-7 h-7"></i>
                </div>
                <div>
                    <p class="text-sm text-gray-500 font-medium">이메일</p>
                    <p class="text-xl font-bold text-gray-800">test@example.com</p>
                </div>
            </div>

            <!-- Card 4: Products -->
            <div
                class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex items-center space-x-4 hover:shadow-md transition">
                <div
                    class="w-14 h-14 bg-orange-500 rounded-xl flex items-center justify-center text-white shadow-orange-200 shadow-lg">
                    <i data-lucide="package" class="w-7 h-7"></i>
                </div>
                <div>
                    <p class="text-sm text-gray-500 font-medium">취급 품목</p>
                    <p class="text-xl font-bold text-gray-800">전자제품, 의류</p>
                </div>
            </div>

        </div>

        <!-- Section 2: Logistics Requirements (Dashed Border Style) -->
        <div class="bg-white p-8 rounded-3xl shadow-sm border border-gray-100">
            <h2 class="text-xl font-bold text-gray-800 mb-6 flex items-center">
                <i data-lucide="bar-chart-3" class="w-6 h-6 mr-2 text-blue-600"></i>
                물류 요구 사항
            </h2>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <!-- Stat 1 -->
                <div
                    class="border-2 border-dashed border-gray-200 p-8 rounded-2xl flex flex-col items-center justify-center text-center hover:border-blue-300 hover:bg-blue-50 transition group">
                    <div class="p-3 bg-gray-50 rounded-full mb-4 group-hover:bg-white transition">
                        <i data-lucide="box" class="w-8 h-8 text-gray-400 group-hover:text-blue-600 transition"></i>
                    </div>
                    <p class="text-gray-500 text-sm mb-1">필요 면적</p>
                    <p class="text-2xl font-bold text-gray-800 group-hover:text-blue-600 transition">150 py</p>
                </div>

                <!-- Stat 2 -->
                <div
                    class="border-2 border-dashed border-gray-200 p-8 rounded-2xl flex flex-col items-center justify-center text-center hover:border-purple-300 hover:bg-purple-50 transition group">
                    <div class="p-3 bg-gray-50 rounded-full mb-4 group-hover:bg-white transition">
                        <i data-lucide="activity"
                            class="w-8 h-8 text-gray-400 group-hover:text-purple-600 transition"></i>
                    </div>
                    <p class="text-gray-500 text-sm mb-1">월 평균 출고량</p>
                    <p class="text-2xl font-bold text-gray-800 group-hover:text-purple-600 transition">5,000 건</p>
                </div>

                <!-- Stat 3 -->
                <div
                    class="border-2 border-dashed border-gray-200 p-8 rounded-2xl flex flex-col items-center justify-center text-center hover:border-orange-300 hover:bg-orange-50 transition group">
                    <div class="p-3 bg-gray-50 rounded-full mb-4 group-hover:bg-white transition">
                        <i data-lucide="layers"
                            class="w-8 h-8 text-gray-400 group-hover:text-orange-600 transition"></i>
                    </div>
                    <p class="text-gray-500 text-sm mb-1">보관 파렛트</p>
                    <p class="text-2xl font-bold text-gray-800 group-hover:text-orange-600 transition">300 PLT</p>
                </div>
            </div>
        </div>

    </div>

    <script>
        lucide.createIcons();
    </script>
</body>

</html>
